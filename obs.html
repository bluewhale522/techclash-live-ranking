<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TECH CLASH 2026 — MÀN HÌNH PHÁT LIVESTREAM OBS (16:9 CHUẨN KHUNG MINDX)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cyan: #38bdf8;
      --cyan-glow: #67e8f9;
      --fire: #f97316;
      --fire-red: #ef4444;
      --gold: #fbbf24;
      --emerald: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      font-family: 'Inter', sans-serif;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* KHUNG LIVESTREAM 16:9 KHỚP CHÍNH XÁC TỪNG PIXEL VỚI ẢNH NỀN MINDX (1024x576 / 1920x1080) */
    .livestream-canvas {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* Chuẩn 16:9 */
      max-height: 100vh;
      max-width: 177.78vh;
      background: transparent;
      overflow: hidden;
    }

    /* Lớp ảnh nền MindX tách riêng để hỗ trợ ĐỤC LỖ TRONG SUỐT (Alpha Cutout) ngay trong lòng Khung Lớn cho Camera OBS bên dưới */
    .livestream-bg-layer {
      position: absolute;
      inset: 0;
      background-image: url('obs-bg.jpg?v=5');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
      pointer-events: none;
      transition: clip-path 0.35s ease, opacity 0.35s ease;
    }

    /* Chế độ đổi nền sang bản có Logo MindX Thái Nguyên (TN) ở góc trên bên phải */
    body.bg-tn .livestream-bg-layer {
      background-image: url('obs-bg-tn.jpg?v=1');
    }

    /* Chế độ ĐỤC LỖ KHUNG LỚN (x: 6.6% -> 71.8%, y: 18.0% -> 83.4%) */
    body.cutout-main-hole .livestream-bg-layer {
      clip-path: polygon(
        0% 0%,
        0% 100%,
        6.6% 100%,
        6.6% 18.0%,
        71.8% 18.0%,
        71.8% 83.4%,
        6.6% 83.4%,
        6.6% 100%,
        100% 100%,
        100% 0%
      );
    }

    /* Chế độ VIDEO TO TOÀN MÀN HÌNH (Chỉ còn khung video lớn + thanh chạy chữ dưới cùng, ẩn Timer, Next Round, Tiến độ & Tên đội) */
    body.camera-full-mode .livestream-bg-layer {
      clip-path: polygon(
        0% 0%,
        0% 100%,
        1.2% 100%,
        1.2% 2%,
        98.8% 2%,
        98.8% 88%,
        1.2% 88%,
        1.2% 100%,
        100% 100%,
        100% 0%
      );
    }
    body.camera-full-mode .stream-top-hud,
    body.camera-full-mode .box-top-right,
    body.camera-full-mode .box-bottom-right {
      display: none !important;
    }
    body.camera-full-mode .box-main-left {
      left: 1.2%;
      top: 2%;
      width: 97.6%;
      height: 86%;
      padding: 0.7vw 0.9vw;
      border-radius: 0.9vw;
      border: 2px solid rgba(103, 232, 249, 0.75);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.35), inset 0 0 18px rgba(56, 189, 248, 0.15);
    }

    /* Chế độ ĐỤC LỖ CHROMA KEY XANH LÁ (#00FF00) trong lòng Khung Lớn */
    .box-main-left.chroma-green-hole,
    .arena-video-hole.chroma-green-hole {
      background: #00ff00 !important;
      box-shadow: inset 0 0 0 2px #00cc00;
    }

    /* Vùng đục lỗ hiển thị Video/Camera nằm ngay dưới Thanh Chữ Đội Đấu trên đầu Khung Lớn */
    .arena-video-hole {
      flex: 1;
      width: 100%;
      min-height: 0;
      border-radius: 0.5vw;
      background: transparent;
      pointer-events: none;
    }

    /* Chế độ ẩn toàn bộ ảnh nền (Overlay trong suốt hoàn toàn) */
    body.transparent-mode .livestream-bg-layer {
      opacity: 0 !important;
      background-image: none !important;
    }

    /* HIỆU ỨNG CHUYỂN CẢNH 3 GIÂY (STINGER TRANSITIONS LỬA & BĂNG ĐIỀU KHIỂN TỪ ADMIN) */
    .stinger-overlay {
      position: absolute;
      inset: 0;
      z-index: 9000;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      overflow: hidden;
    }

    .stinger-overlay.active {
      visibility: visible;
      animation: stingerMaster 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .stinger-wing-fire {
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, #7f1d1d 0%, #ea580c 48%, #fbbf24 50%, transparent 50.5%);
      transform: translateX(-105%);
    }

    .stinger-wing-ice {
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, transparent 49.5%, #38bdf8 50%, #0284c7 55%, #090d16 100%);
      transform: translateX(105%);
    }

    .stinger-overlay.active .stinger-wing-fire {
      animation: wingFireIn 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .stinger-overlay.active .stinger-wing-ice {
      animation: wingIceIn 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .stinger-center-card {
      position: relative;
      z-index: 2;
      background: rgba(6, 10, 22, 0.94);
      border: 2px solid #67e8f9;
      border-radius: 1vw;
      padding: 1.5vw 3.2vw;
      text-align: center;
      box-shadow: 0 0 60px rgba(56, 189, 248, 0.8), 0 0 90px rgba(249, 115, 22, 0.6);
      transform: scale(0.7);
      opacity: 0;
    }

    .stinger-overlay.active .stinger-center-card {
      animation: stingerCardPop 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .stinger-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.5vw;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-shadow: 0 0 24px rgba(56, 189, 248, 0.9);
      white-space: nowrap;
    }

    .stinger-sub {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.05vw;
      font-weight: 800;
      color: #fbbf24;
      margin-top: 0.35vw;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @keyframes stingerMaster {
      0% { opacity: 1; }
      86% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    @keyframes wingFireIn {
      0% { transform: translateX(-105%); }
      20% { transform: translateX(0%); }
      78% { transform: translateX(0%); }
      100% { transform: translateX(-105%); }
    }

    @keyframes wingIceIn {
      0% { transform: translateX(105%); }
      20% { transform: translateX(0%); }
      78% { transform: translateX(0%); }
      100% { transform: translateX(105%); }
    }

    @keyframes stingerCardPop {
      0% { transform: scale(0.65); opacity: 0; }
      20% { transform: scale(1.03); opacity: 1; }
      78% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.12); opacity: 0; }
    }

    /* ============================================================================
     * HIỆU ỨNG TRANSITIONS ĐẶC BIỆT: LOGO_TN ĐẬP VỠ LOGO MINDX LÊN NGÔI (2.4s)
     * ============================================================================ */
    .tn-smash-overlay {
      position: absolute;
      inset: 0;
      z-index: 9500;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.96) 0%, rgba(3, 6, 14, 0.98) 100%);
      opacity: 0;
      visibility: hidden;
      overflow: hidden;
    }

    .tn-smash-overlay.active {
      visibility: visible;
      animation: tnSmashMaster 2.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes tnSmashMaster {
      0% { opacity: 0; }
      6% { opacity: 1; }
      84% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.04); visibility: hidden; }
    }

    .tn-smash-stage {
      position: relative;
      width: 34vw;
      height: 22vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Logo MindX gốc đứng chờ ở tâm, sau đó vỡ tung thành 6 mảnh khi bị đập */
    .mindx-victim-wrap {
      position: absolute;
      width: 24vw;
      height: 10.2vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mindx-shard {
      position: absolute;
      inset: 0;
      background: url('logo/logo_mindx_trang_clean.png') center / contain no-repeat;
      opacity: 0;
    }

    .tn-smash-overlay.active .mindx-shard.s1 {
      clip-path: polygon(0 0, 52% 0, 44% 52%, 0 48%);
      animation: shardFly1 2.4s ease-out forwards;
    }
    .tn-smash-overlay.active .mindx-shard.s2 {
      clip-path: polygon(52% 0, 100% 0, 100% 48%, 44% 52%);
      animation: shardFly2 2.4s ease-out forwards;
    }
    .tn-smash-overlay.active .mindx-shard.s3 {
      clip-path: polygon(0 48%, 44% 52%, 35% 100%, 0 100%);
      animation: shardFly3 2.4s ease-out forwards;
    }
    .tn-smash-overlay.active .mindx-shard.s4 {
      clip-path: polygon(44% 52%, 100% 48%, 100% 100%, 35% 100%);
      animation: shardFly4 2.4s ease-out forwards;
    }

    @keyframes shardFly1 {
      0%, 18% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
      36% { opacity: 0.9; transform: translate(-38vw, -12vw) rotate(-140deg) scale(0.75); }
      52%, 100% { opacity: 0; transform: translate(-55vw, -18vw) rotate(-220deg) scale(0.3); }
    }
    @keyframes shardFly2 {
      0%, 18% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
      36% { opacity: 0.9; transform: translate(-30vw, -18vw) rotate(-95deg) scale(0.75); }
      52%, 100% { opacity: 0; transform: translate(-48vw, -26vw) rotate(-180deg) scale(0.3); }
    }
    @keyframes shardFly3 {
      0%, 18% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
      36% { opacity: 0.9; transform: translate(-42vw, 8vw) rotate(-160deg) scale(0.7); }
      52%, 100% { opacity: 0; transform: translate(-60vw, 14vw) rotate(-260deg) scale(0.25); }
    }
    @keyframes shardFly4 {
      0%, 18% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
      36% { opacity: 0.9; transform: translate(-34vw, 15vw) rotate(-115deg) scale(0.7); }
      52%, 100% { opacity: 0; transform: translate(-52vw, 22vw) rotate(-195deg) scale(0.25); }
    }

    /* Vòng sóng xung kích & lóe sáng lúc va chạm */
    .tn-impact-ring {
      position: absolute;
      width: 8vw;
      height: 8vw;
      border-radius: 50%;
      border: 0.45vw solid #fbbf24;
      box-shadow: 0 0 40px #fbbf24, inset 0 0 25px #ef4444;
      opacity: 0;
    }

    .tn-smash-overlay.active .tn-impact-ring {
      animation: impactWave 2.4s ease-out forwards;
    }

    @keyframes impactWave {
      0%, 20% { opacity: 0; transform: scale(0.2); }
      22% { opacity: 1; transform: scale(0.6); }
      45% { opacity: 0; transform: scale(5.2); }
      100% { opacity: 0; }
    }

    /* Hào quang vàng hoàng gia phía sau logo_TN khi lên ngôi */
    .tn-royal-aura {
      position: absolute;
      width: 30vw;
      height: 30vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(251, 191, 36, 0.55) 0%, rgba(245, 158, 11, 0.18) 45%, transparent 72%);
      opacity: 0;
    }

    .tn-smash-overlay.active .tn-royal-aura {
      animation: royalAuraIn 2.4s ease-out forwards;
    }

    @keyframes royalAuraIn {
      0%, 22% { opacity: 0; transform: scale(0.4); }
      35% { opacity: 1; transform: scale(1.15); }
      82% { opacity: 0.95; transform: scale(1.05); }
      100% { opacity: 0; transform: scale(1.2); }
    }

    /* Logo TN giáng xuống đập vỡ MindX rồi tỏa sáng lên ngôi */
    .tn-victor-card {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
    }

    .tn-smash-overlay.active .tn-victor-card {
      animation: tnSmashDownRise 2.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes tnSmashDownRise {
      0% { opacity: 0; transform: translate(-28vw, 18vh) scale(1.7) rotate(-14deg); }
      18% { opacity: 1; transform: translate(0, 0) scale(1.12) rotate(0deg); }
      32% { opacity: 1; transform: translate(0, 0) scale(1.02); }
      68% { opacity: 1; transform: translate(0, 0) scale(1.06); }
      88% { opacity: 1; transform: translate(35.2vw, -40.5vh) scale(0.46) rotate(0deg); }
      100% { opacity: 0; transform: translate(35.2vw, -40.5vh) scale(0.46); }
    }

    .tn-crown {
      font-size: 4.2vw;
      line-height: 1;
      margin-bottom: -0.5vw;
      filter: drop-shadow(0 0 18px rgba(251, 191, 36, 0.95));
      opacity: 0;
    }

    .tn-smash-overlay.active .tn-crown {
      animation: crownDrop 2.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes crownDrop {
      0%, 26% { opacity: 0; transform: translateY(-5vw) scale(1.6) rotate(-12deg); }
      38% { opacity: 1; transform: translateY(0) scale(1.1) rotate(0deg); }
      82% { opacity: 1; transform: translateY(0) scale(1.05); }
      100% { opacity: 0; }
    }

    .tn-logo-frame {
      background: #ffffff;
      padding: 1.1vw 1.8vw;
      border-radius: 1.1vw;
      border: 3px solid #fbbf24;
      box-shadow: 0 0 45px rgba(251, 191, 36, 0.85), 0 14px 40px rgba(0, 0, 0, 0.85);
    }

    .tn-logo-frame img {
      width: 21vw;
      height: auto;
      display: block;
    }

    .tn-victor-caption {
      margin-top: 0.9vw;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.45vw;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fde68a;
      text-shadow: 0 0 22px rgba(251, 191, 36, 0.95), 0 3px 10px rgba(0, 0, 0, 0.95);
      white-space: nowrap;
    }

    /* Tiêu đề Esports 2 dòng gọn gàng ở khoảng trống phía trên Khung Lớn */
    .stream-top-hud {
      position: absolute;
      left: 6.3%;
      top: 3.2%;
      width: 65.8%;
      height: 12.2%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 0.38vw;
      pointer-events: none;
      white-space: nowrap;
    }

    .hud-title-block {
      display: flex;
      align-items: center;
      gap: 0.8vw;
      min-width: 0;
      white-space: nowrap;
    }

    .hud-live-badge {
      background: linear-gradient(135deg, #dc2626 0%, #ea580c 100%);
      color: #fff;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 900;
      font-size: 0.84vw;
      letter-spacing: 0.1em;
      padding: 0.34vw 0.8vw;
      border-radius: 0.38vw;
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.7);
      display: flex;
      align-items: center;
      gap: 0.4vw;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .hud-live-dot {
      width: 0.5vw;
      height: 0.5vw;
      border-radius: 50%;
      background: #fff;
      animation: blinkDot 0.9s infinite alternate;
    }

    @keyframes blinkDot {
      from { opacity: 0.3; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1.15); }
    }

    .hud-main-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.85vw;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ffffff;
      white-space: nowrap;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.95), 0 0 24px rgba(56, 189, 248, 0.55);
    }

    .hud-progress-pill {
      background: rgba(7, 13, 25, 0.85);
      border: 1px solid rgba(103, 232, 249, 0.55);
      padding: 0.32vw 0.9vw;
      border-radius: 999px;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.84vw;
      font-weight: 800;
      color: #67e8f9;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.3);
      backdrop-filter: blur(6px);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ============================================================================
     * KHUNG 1: KHUNG LỚN BÊN TRÁI (x: 6.3% -> 72.1%, y: 17.6% -> 83.8%)
     * ============================================================================ */
    .box-main-left {
      position: absolute;
      left: 6.3%;
      top: 17.6%;
      width: 65.8%;
      height: 66.2%;
      padding: 0.8vw 0.9vw;
      display: flex;
      flex-direction: column;
      gap: 0.6vw;
      overflow: hidden;
      border-radius: 0.6vw;
    }

    /* Thanh VS Trận Hiện Tại trên đỉnh Khung Lớn (Nền đặc 100% để không bị xuyên thấu khi lọc Chroma Key #00FF00) */
    .live-match-strip {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.8vw;
      background: linear-gradient(90deg, #6b1414 0%, #090e1c 50%, #093b5e 100%);
      border: 1.5px solid rgba(103, 232, 249, 0.65);
      border-radius: 0.55vw;
      padding: 0.52vw 1vw;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.75);
      flex-shrink: 0;
      position: relative;
      z-index: 5;
    }

    .strip-team {
      display: flex;
      flex-direction: column;
      gap: 0.12vw;
      min-width: 0;
      overflow: hidden;
    }

    .strip-team.blue {
      text-align: right;
      align-items: flex-end;
    }

    .strip-side-label {
      font-size: 0.64vw;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .strip-side-label.red { color: #fca5a5; }
    .strip-side-label.blue { color: #7dd3fc; }

    .strip-team-name {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.15vw;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .strip-team-stu {
      font-size: 0.74vw;
      font-weight: 600;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .strip-vs-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.25vw 0.85vw;
      background: rgba(6, 10, 20, 0.9);
      border: 1px solid rgba(251, 191, 36, 0.55);
      border-radius: 0.45vw;
      min-width: 9.2vw;
      flex-shrink: 0;
    }

    .strip-vs-top {
      font-size: 0.62vw;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 0.07em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .strip-vs-main {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.38vw;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.1;
      white-space: nowrap;
    }

    /* Lưới 2 Bảng Xếp Hạng (Bảng A bên Lửa Đỏ/Cam - Bảng B bên Băng Xanh) */
    .dual-ranking-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75vw;
      overflow: hidden;
      min-height: 0;
    }

    .dual-ranking-grid.single-col {
      grid-template-columns: 1fr;
    }

    .rank-column {
      display: flex;
      flex-direction: column;
      border-radius: 0.55vw;
      overflow: hidden;
      backdrop-filter: blur(5px);
      min-height: 0;
    }

    .rank-column.fire-a {
      background: linear-gradient(180deg, rgba(67, 20, 7, 0.62) 0%, rgba(9, 13, 24, 0.72) 100%);
      border: 1px solid rgba(249, 115, 22, 0.45);
    }

    .rank-column.ice-b {
      background: linear-gradient(180deg, rgba(8, 47, 73, 0.62) 0%, rgba(9, 13, 24, 0.72) 100%);
      border: 1px solid rgba(56, 189, 248, 0.45);
    }

    .rank-col-header {
      padding: 0.55vw 0.9vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.02vw;
      font-weight: 900;

  <script>
    (function() {
      const Engine = window.TechClashEngine;
      const STORAGE_KEY = 'TECHCLASH_2026_VONG2_DEMO_V2';
      const bc = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('techclash_2026_vong2_channel') : null;

      let state = loadState();
      // Mặc định trên Livestream đục lỗ trong suốt 100% Khung Chính 16:9 để hiển thị Video/Camera OBS (hoặc chuyển sang BXH/Kết quả từ Admin)
      if (!state.config.obsMainView || state.config.obsMainView === 'arena') {
        state.config.obsMainView = 'camera';
      }

      let timerState = {
        mode: 'match',
        totalSec: 90,
        remainingSec: 90,
        running: false,
        endTime: null
      };
      let serverTimeOffset = 0;
      let localEndTime = null;
      const API_BASE = (typeof window !== 'undefined' && window.location.protocol.startsWith('http'))
        ? ''
        : 'http://127.0.0.1:8088';

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.teams) && Array.isArray(parsed.matches)) {
              return parsed;
            }
          }
        } catch (e) {}
        const teams = JSON.parse(JSON.stringify(Engine.INITIAL_TEAMS));
        const matches = Engine.generateInterleavedSchedule(teams, false);
        Engine.populateDemoMatches(matches, 'mid');
        return {
          config: { ...Engine.DEFAULT_CONFIG, obsMainView: 'camera' },
          teams,
          matches,
          lastUpdated: new Date().toISOString()
        };
      }

      function getTeamById(id) {
        return state.teams.find(t => t.id === id) || {
          id, code: id, className: id, student1: 'Học sinh 1', student2: 'Học sinh 2', bracket: 'A'
        };
      }

      function getCurrentMatch() {
        let m = state.matches.find(x => x.status === 'live');
        if (!m) m = state.matches.find(x => x.status === 'pending');
        if (!m && state.matches.length > 0) m = state.matches[state.matches.length - 1];
        return m;
      }

      function getNextMatches(curMatch) {
        if (!curMatch) return [];
        const idx = state.matches.findIndex(x => x.id === curMatch.id);
        return state.matches.slice(idx + 1, idx + 3);
      }

      function formatSec(sec) {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      }

      let lastTransitionId = (state.config && state.config.transitionTrigger && state.config.transitionTrigger.id) || 0;
      let lastObsView = (state.config && state.config.obsMainView) || 'ranking_A';

      // ==================== BỘ TẠO SOUND EFFECT TRANSITIONS 1.5 GIÂY (ESPORTS STINGER WHOOSH + IMPACT BOOM) ====================
      let stingerAudioUrl = null;
      let stingerAudioCtx = null;

      function buildStingerWavUrl() {
        if (stingerAudioUrl) return stingerAudioUrl;
        try {
          const sampleRate = 44100;
          const duration = 1.5;
          const numSamples = Math.floor(sampleRate * duration);
          const buffer = new ArrayBuffer(44 + numSamples * 2);
          const view = new DataView(buffer);

          function writeStr(offset, str) {
            for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
          }
          writeStr(0, 'RIFF');
          view.setUint32(4, 36 + numSamples * 2, true);
          writeStr(8, 'WAVE');
          writeStr(12, 'fmt ');
          view.setUint32(16, 16, true);
          view.setUint16(20, 1, true); // PCM
          view.setUint16(22, 1, true); // Mono
          view.setUint32(24, sampleRate, true);
          view.setUint32(28, sampleRate * 2, true);
          view.setUint16(32, 2, true);
          view.setUint16(34, 16, true);
          writeStr(36, 'data');
          view.setUint32(40, numSamples * 2, true);

          let noiseState = 0;
          let phaseSub = 0, phaseRiser = 0, phaseC1 = 0, phaseC2 = 0, phaseC3 = 0;

          for (let i = 0; i < numSamples; i++) {
            const t = i / sampleRate;
            let sample = 0;
            const white = Math.random() * 2 - 1;

            // 1. 0.00s -> 0.28s: Whoosh lao vào
            if (t < 0.28) {
              const env = Math.sin((t / 0.28) * Math.PI);
              const alpha = 0.08 + 0.38 * (t / 0.28);
              noiseState = noiseState + alpha * (white - noiseState);
              const riserFreq = 120 * Math.pow(4.0, t / 0.28);
              phaseRiser += (2 * Math.PI * riserFreq) / sampleRate;
              sample += noiseState * env * 0.65 + Math.sin(phaseRiser) * env * 0.35;
            }

            // 2. 0.24s -> 1.05s: Sub-Bass Impact Boom + Cyber Chord
            if (t >= 0.24 && t < 1.05) {
              const dt = t - 0.24;
              const boomEnv = Math.exp(-dt * 6.5);
              const subFreq = 42 + 120 * Math.exp(-dt * 16);
              phaseSub += (2 * Math.PI * subFreq) / sampleRate;
              const subWave = Math.sin(phaseSub) * boomEnv * 0.85;

              const chordEnv = Math.min(1, dt / 0.02) * Math.exp(-dt * 3.5);
              phaseC1 += (2 * Math.PI * 261.63) / sampleRate;
              phaseC2 += (2 * Math.PI * 392.00) / sampleRate;
              phaseC3 += (2 * Math.PI * 523.25) / sampleRate;
              const chordWave = (Math.sin(phaseC1) * 0.35 + Math.sin(phaseC2) * 0.3 + Math.sin(phaseC3) * 0.25) * chordEnv * 0.5;

              const hitEnv = Math.exp(-dt * 26);
              sample += subWave + chordWave + white * hitEnv * 0.4;
            }

            // 3. 1.05s -> 1.48s: Swoosh mở cánh ra cảnh mới
            if (t >= 1.05 && t < 1.48) {
              const dt2 = (t - 1.05) / 0.43;
              const env2 = Math.sin(dt2 * Math.PI);
              const alpha2 = 0.42 - 0.34 * dt2;
              noiseState = noiseState + alpha2 * (white - noiseState);
              const dropFreq = 380 * Math.pow(0.35, dt2);
              phaseRiser += (2 * Math.PI * dropFreq) / sampleRate;
              sample += noiseState * env2 * 0.58 + Math.sin(phaseRiser) * env2 * 0.25;
            }

            const clamped = Math.max(-1, Math.min(1, sample * 0.95));
            view.setInt16(44 + i * 2, clamped < 0 ? clamped * 0x8000 : clamped * 0x7FFF, true);
          }

          const blob = new Blob([buffer], { type: 'audio/wav' });
          stingerAudioUrl = URL.createObjectURL(blob);
        } catch (err) {}
        return stingerAudioUrl;
      }

      function playTransitionSoundEffect() {
        if (state.config && state.config.transitionSound === false) return;
        try {
          const url = buildStingerWavUrl();
          if (url) {
            const audio = new Audio(url);
            audio.volume = 0.9;
            const playPromise = audio.play();
            if (playPromise && typeof playPromise.catch === 'function') {
              playPromise.catch(() => playWebAudioFallback());
            }
            return;
          }
        } catch (e) {}
        playWebAudioFallback();
      }

      function playWebAudioFallback() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          if (!stingerAudioCtx) stingerAudioCtx = new AudioCtx();
          if (stingerAudioCtx.state === 'suspended') stingerAudioCtx.resume();
          const now = stingerAudioCtx.currentTime;

          // Riser + Impact Boom
          const osc = stingerAudioCtx.createOscillator();
          const gain = stingerAudioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(110, now);
          osc.frequency.exponentialRampToValueAtTime(440, now + 0.36);
          osc.frequency.setValueAtTime(140, now + 0.37);
          osc.frequency.exponentialRampToValueAtTime(38, now + 1.4);

          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.45, now + 0.36);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
          osc.connect(gain);
          gain.connect(stingerAudioCtx.destination);
          osc.start(now);
          osc.stop(now + 1.55);
        } catch (e) {}
      }

      // Tự động mở khóa âm thanh trên trình duyệt khi có tương tác đầu tiên
      ['click', 'keydown', 'touchstart'].forEach(evt => {
        window.addEventListener(evt, () => {
          buildStingerWavUrl();
          if (stingerAudioCtx && stingerAudioCtx.state === 'suspended') {
            stingerAudioCtx.resume().catch(() => {});
          }
        }, { once: true });
      });

      function triggerStingerOverlay(titleText, subText, mode) {
        if (mode === 'tn_smash') {
          const tnOv = document.getElementById('tn-smash-overlay');
          const cap = document.getElementById('tn-smash-caption');
          if (tnOv) {
            if (cap) cap.textContent = titleText || 'MINDX THÁI NGUYÊN • LÊN NGÔI VÔ ĐỊCH';
            tnOv.classList.remove('active');
            void tnOv.offsetWidth;
            tnOv.classList.add('active');
            playTransitionSoundEffect();
            if (window.VexIQSound) {
              setTimeout(() => { window.VexIQSound.playStart(); }, 480);
            }
          }
          return;
        }
        const ov = document.getElementById('stinger-overlay');
        const tEl = document.getElementById('stinger-title');
        const sEl = document.getElementById('stinger-sub');
        if (!ov) return;
        if (tEl) tEl.textContent = titleText || state.config.transitionTitle || 'TECH CLASH: FINALE 2026';
        if (sEl) sEl.textContent = subText || state.config.transitionSub || 'MINDX THÁI NGUYÊN • VÒNG 2 CHUNG KẾT ĐỒNG ĐỘI';
        ov.classList.remove('active');
        void ov.offsetWidth;
        ov.classList.add('active');
        playTransitionSoundEffect();
      }

      function renderAll() {
        const viewMode = state.config.obsMainView || 'ranking_A';
        const trig = state.config.transitionTrigger;

        // Phát hiệu ứng Transitions (1.5s hoặc TN Smash) khi Admin bấm nút Transition hoặc đổi cảnh trên Admin
        if (trig && trig.id && trig.id !== lastTransitionId) {
          lastTransitionId = trig.id;
          triggerStingerOverlay(trig.title, trig.subtitle, trig.mode);
        } else if (viewMode !== lastObsView) {
          lastObsView = viewMode;
          const autoTitle = viewMode === 'result'
            ? 'KẾT QUẢ CHÍNH THỨC'
            : (viewMode === 'ranking_B'
                ? 'BẢNG XẾP HẠNG LIVE • BẢNG B (TEEN CODER)'
                : (viewMode === 'ranking_A' || viewMode === 'ranking_split'
                    ? 'BẢNG XẾP HẠNG LIVE • BẢNG A (JUNIOR CODER)'
                    : (state.config.transitionTitle || 'TRỰC TIẾP THI ĐẤU')));
          triggerStingerOverlay(autoTitle, state.config.transitionSub || 'MINDX THÁI NGUYÊN • TECH CLASH 2026');
        }

        if (state.config.obsBgMode === 'transparent') {
          document.body.classList.add('transparent-mode');
        } else {
          document.body.classList.remove('transparent-mode');
        }

        if (state.config.obsBgVariant === 'tn') {
          document.body.classList.add('bg-tn');
        } else {
          document.body.classList.remove('bg-tn');
        }

        // Chế độ Phát Video Phỏng Vấn Full Màn Hình (Phát trực tiếp file MP4 trên Server, không khung OBS)
        const fvOv = document.getElementById('fullscreen-video-overlay');
        const fvPlayer = document.getElementById('fullscreen-video-player');
        if (fvOv && fvPlayer) {
          if (viewMode === 'video_full' && state.config.activeVideo && (state.config.activeVideo.src || state.config.activeVideo.id)) {
            const playKey = String(state.config.activeVideo.playId || state.config.activeVideo.src || state.config.activeVideo.id);
            fvOv.style.display = 'block';
            if (fvOv.getAttribute('data-play-key') !== playKey) {
              fvOv.setAttribute('data-play-key', playKey);
              fvPlayer.src = state.config.activeVideo.src || ('videos/' + state.config.activeVideo.id);
              fvPlayer.muted = false;
              fvPlayer.volume = 1.0;
              fvPlayer.load();
              const unmuteBtn = document.getElementById('btn-unmute-video');
              const tryPlay = () => {
                fvPlayer.muted = false;
                fvPlayer.volume = 1.0;
                const p = fvPlayer.play();
                if (p && typeof p.then === 'function') {
                  p.then(() => {
                    if (unmuteBtn) unmuteBtn.style.display = 'none';
                  }).catch(() => {
                    fvPlayer.muted = true;
                    if (unmuteBtn) unmuteBtn.style.display = 'block';
                    fvPlayer.play().catch(() => {});
                  });
                }
              };
              tryPlay();
              fvPlayer.oncanplay = () => {
                if (fvPlayer.paused) tryPlay();
              };
            }
          } else {
            fvOv.style.display = 'none';
            if (fvOv.getAttribute('data-play-key')) {
              fvOv.removeAttribute('data-play-key');
              fvPlayer.oncanplay = null;
              try { fvPlayer.pause(); } catch (e) {}
              fvPlayer.removeAttribute('src');
              fvPlayer.load();
            }
          }
        }

        // Bật chế độ ĐỤC LỖ TRONG SUỐT 100% (Alpha Cutout) ngay trong lòng Khung Chính khi chọn Đục lỗ Camera / Video / Chroma Key
        if (viewMode === 'camera' || viewMode === 'cutout_clean' || viewMode === 'arena' || viewMode === 'chroma_green') {

          document.body.classList.remove('cutout-main-hole');

          document.body.classList.add('camera-full-mode');
        } else {
          document.body.classList.remove('camera-full-mode');

        const doneCount = state.matches.filter(m => m.status === 'completed').length;
        const curMatch = getCurrentMatch();
        const progEl = document.getElementById('hud-progress');
        if (progEl) {
          if (state.config && state.config.hideProgress) {
            progEl.style.display = 'none';
          } else {

            if (curMatch) {

            } else {
              progEl.textContent = progLabel;
            }
          }
        }

        renderTopRightTimer(curMatch);
        renderBottomRightNextRound(curMatch);
        renderMainLeftBox(curMatch);
        renderTicker();
      }

      // KHUNG TRÊN BÊN PHẢI: CHỈ ĐỒNG HỒ ĐẾM NGƯỢC (1 DÒNG GỌN GÀNG, KHÔNG ICON THỪA)

        const el = document.getElementById('box-top-right');
        if (!el) return;
        if (!curMatch) {
          el.innerHTML = `
            <div class="timer-match-badge">CHƯA CÓ TRẬN ĐẤU</div>

          `;
          return;
        }

        const rT = getTeamById(curMatch.redTeamId);
        const bT = getTeamById(curMatch.blueTeamId);
        const rem = timerState.remainingSec;
        const isSwap = timerState.mode === 'match' && rem <= 50 && rem >= 40 && rem > 0;
        const isEnded = rem <= 0;
        const isRevealed = curMatch.status === 'completed';

        let statusText = `<span style="color:#fca5a5;">ĐỎ: ${rT.className}</span> &nbsp;vs&nbsp; <span style="color:#7dd3fc;">XANH: ${bT.className}</span>`;
        let statusCls = '';

        if (isRevealed) {
          statusText = `ĐÃ CÔNG BỐ: ĐỎ ${curMatch.redScore}đ — XANH ${curMatch.blueScore}đ`;
          statusCls = 'revealed';
        } else if (isEnded) {
          statusText = 'HẾT GIỜ — TRỌNG TÀI ĐANG CHẤM ĐIỂM';
          statusCls = 'swap-warning';
        } else if (isSwap) {
          const swapWords = { 10:'TEN (10)', 9:'NINE (9)', 8:'EIGHT (8)', 7:'SEVEN (7)', 6:'SIX (6)', 5:'FIVE (5)', 4:'FOUR (4)', 3:'THREE (3)', 2:'TWO (2)', 1:'ONE (1)', 0:'SWITCH!' };
          const cWord = swapWords[rem - 40] || '';
          statusText = `ĐỔI TABLET (50s–40s): ${cWord} • QUÊN -5Đ`;
          statusCls = 'swap-warning';
        } else if (timerState.mode === 'prep') {
          statusText = '30 GIÂY CHUẨN BỊ ĐẶT ROBOT';
        }

        el.innerHTML = `
          <div class="timer-match-badge">
            TRẬN #${curMatch.matchNumber} • LƯỢT ${curMatch.wave} • BẢNG ${curMatch.bracket}
          </div>
          <div class="timer-big-clock ${isSwap ? 'swap-warning' : ''} ${isEnded && !isRevealed ? 'ended' : ''}">
            ${formatSec(timerState.remainingSec)}
          </div>
          <div class="timer-status-bar ${statusCls}">
            ${statusText}
          </div>
        `;
      }

                  <div style="font-family:'Chakra Petch';font-size:2.6vw;font-weight:900;color:#7dd3fc;margin-right:0.6vw;">${bScore}</div>

              <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8vw;font-size:0.74vw;">

                </div>
                <div style="background:rgba(15,23,42,0.8);padding:0.45vw 0.75vw;border-radius:0.45vw;border-left:3px solid #38bdf8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                  <b>Đội Xanh:</b> To <b>${bs.big||0}</b> • Vừa <b>${bs.med||0}</b> • Nhỏ <b>${bs.small||0}</b>
                  ${targetM.bracket === 'B' ? ` • Chồng <b>${(bs.stackBig||0)+(bs.stackMed||0)+(bs.stackSmall||0)}</b>` : ''}
                  • Khối ĐB <b>${bs.special > 0 ? '+10đ' : '0'}</b> • Về đích <b>${bs.parked > 0 ? '+5đ' : '0'}</b>
                  ${bs.noTabletSwap > 0 ? ' • <span style="color:#f87171;">Quên đổi (-5đ)</span>' : ''}
                </div>
              </div>
            </div>
          `;
          return;
        }

        // Mặc định: Hiển thị Bảng Xếp Hạng TỪNG BẢNG ĐẤU 1 (Bảng A hoặc Bảng B) toàn chiều ngang, mỗi đội 1 dòng duy nhất
        const standings = Engine.computeStandings(state.teams, state.matches, state.config.rankBy);
        const activeBracket = (viewMode === 'ranking_B') ? 'B' : 'A';

        el.innerHTML = `
          ${matchStripHtml}
          <div class="dual-ranking-grid single-col">
            ${activeBracket === 'B'
              ? renderBracketColumn('B', standings.B, curMatch)
              : renderBracketColumn('A', standings.A, curMatch)}
          </div>
        `;
        const vpNow = document.getElementById('scroll-col-' + activeBracket);
        if (vpNow && scrollPos[activeBracket]) {
          vpNow.scrollTop = scrollPos[activeBracket];
        }
      }

      function shortName2(fullName) {
        const parts = String(fullName || '').trim().split(/\s+/).filter(Boolean);
        if (parts.length <= 2) return parts.join(' ');
        return parts.slice(-2).join(' ');
      }

      function renderBracketColumn(bCode, list, curMatch) {
        const isA = bCode === 'A';
        return `
          <div class="rank-column ${isA ? 'fire-a' : 'ice-b'}">
            <div class="rank-col-header ${isA ? 'fire-a' : 'ice-b'}">
              <span>${isA ? `BẢNG XẾP HẠNG BẢNG A • JUNIOR CODER (${list.length} ĐỘI VEX GO)` : `BẢNG XẾP HẠNG BẢNG B • TEEN CODER (${list.length} ĐỘI VEX IQ)`}</span>
              <span style="font-size:0.68vw;opacity:0.95;">XẾP HẠNG TỔNG ĐIỂM 2 LƯỢT</span>
            </div>
            <div class="rank-table-head">
              <div>HẠNG</div>
              <div>ĐỘI (MÃ LỚP)</div>
              <div>THÀNH VIÊN (2 HỌC SINH)</div>
              <div style="text-align:center;">LƯỢT 1</div>
              <div style="text-align:center;">LƯỢT 2</div>
              <div style="text-align:right;">TỔNG</div>
            </div>
            <div class="rank-scroll-viewport" id="scroll-col-${bCode}">
              ${list.map(item => {
                const rCls = item.rank === 1 ? 'rank-1' : (item.rank === 2 ? 'rank-2' : (item.rank === 3 ? 'rank-3' : ''));
                const isNow = curMatch && (curMatch.redTeamId === item.id || curMatch.blueTeamId === item.id);
                return `
                  <div class="rank-row-item ${rCls} ${isNow ? 'is-playing' : ''}">
                    <div class="r-pos">#${item.rank}</div>
                    <div class="r-class">${item.className} <span style="font-weight:600;color:#94a3b8;font-size:0.78vw;">(${item.code})</span></div>
                    <div class="r-stu">${shortName2(item.student1)} - ${shortName2(item.student2)}</div>
                    <div class="r-turn">${item.turn1Score !== null ? item.turn1Score : '-'}</div>
                    <div class="r-turn">${item.turn2Score !== null ? item.turn2Score : '-'}</div>
                    <div class="r-total">${item.displayPrimary}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      function renderTicker() {
        const el = document.getElementById('ticker-content');
        if (!el) return;
        const defaultPromo = 'MindX Thái Nguyên - Trường học công nghệ đào tạo Lập trình Coding AI và Robotics dành cho học sinh từ 5-18 tuổi - Trải nghiệm miễn phí - Ưu đãi học phí lên đến 25% - Địa chỉ: Tầng 3, Tòa Viettel, số 04 Hoàng Văn Thụ, Thái Nguyên - Hotline: 0865 559 258 - MindX 12 năm rực sáng - Thế hệ chuyển mình';
        const promo = (state.config && state.config.customTickerText) ? state.config.customTickerText : defaultPromo;
        if (el.getAttribute('data-text') === promo) return;
        const highlighted = promo
          .replace(/MindX Thái Nguyên/g, '<b style="color:#ff3b3b;text-shadow:0 0 10px rgba(239,68,68,0.6);">MindX Thái Nguyên</b>')
          .replace(/MindX 12 năm rực sáng/g, '<b style="color:#ff3b3b;text-shadow:0 0 10px rgba(239,68,68,0.6);">MindX 12 năm rực sáng</b>');
        const html = `<span>${highlighted}</span>`;
        el.innerHTML = html + html + html;
        el.setAttribute('data-text', promo);
      }

      // Tự động lăn cuộn mượt cho CẢ BẢNG A VÀ BẢNG B để khán giả nhìn thấy hết mọi đội từ đầu đến cuối bảng
      const scrollDir = { A: 1, B: 1 };
      const scrollPos = { A: 0, B: 0 };
      const scrollPause = { A: 0, B: 0 };
      setInterval(() => {
        ['A', 'B'].forEach(code => {
          const vp = document.getElementById('scroll-col-' + code);
          if (vp && vp.scrollHeight > vp.clientHeight + 2) {
            if (scrollPause[code] > 0) {
              scrollPause[code]--;
              return;
            }
            scrollPos[code] = (vp.scrollTop || 0) + scrollDir[code] * 1.2;
            vp.scrollTop = scrollPos[code];
            if (vp.scrollTop + vp.clientHeight >= vp.scrollHeight - 2) {
              scrollDir[code] = -1;
              scrollPause[code] = 18;
            } else if (vp.scrollTop <= 0) {
              scrollDir[code] = 1;
              scrollPause[code] = 18;
            }
          }
        });
      }, 50);

      let lastPlayedTimerSec = null;

      function triggerVexTimerAudioOnChange(prevRunning, prevSec, newRunning, newSec, mode) {
        if (!window.VexIQSound) return;
        if (state.config && state.config.transitionSound === false) {
          window.VexIQSound.stopBgMusic();
          return;
        }
        if (!prevRunning && newRunning && newSec > 0) {
          window.VexIQSound.playStart();
          window.VexIQSound.startBgMusic();
          lastPlayedTimerSec = newSec;
          return;
        }
        if (prevRunning && !newRunning) {
          window.VexIQSound.stopBgMusic();
        }
        if (newSec !== prevSec && (newRunning || newSec === 0)) {
          if (lastPlayedTimerSec !== newSec) {
            lastPlayedTimerSec = newSec;
            window.VexIQSound.onTimerSecond(newSec, mode);
            if (newSec <= 0) window.VexIQSound.stopBgMusic();
          }
        }
      }

      function applyIncomingTimerState(incoming, srvNow) {
        if (!incoming) return false;
        if (typeof srvNow === 'number' && srvNow > 0) {
          serverTimeOffset = srvNow - Date.now();
        }
        const prevSec = timerState.remainingSec;
        const prevMode = timerState.mode;
        const prevRunning = timerState.running;

        timerState.mode = incoming.mode || 'match';
        timerState.totalSec = incoming.totalSec || (timerState.mode === 'prep' ? 30 : 90);
        timerState.running = !!incoming.running;
        timerState.endTime = incoming.endTime || null;

        if (timerState.running) {
          if (timerState.endTime) {
            const nowEst = Date.now() + serverTimeOffset;
            timerState.remainingSec = Math.max(0, Math.ceil((timerState.endTime - nowEst) / 1000));
            localEndTime = Date.now() + timerState.remainingSec * 1000;
          } else {
            // Nếu chỉ nhận remainingSec từ BroadcastChannel mà chưa có endTime
            if (!prevRunning || Math.abs((incoming.remainingSec || 0) - timerState.remainingSec) > 1) {
              timerState.remainingSec = typeof incoming.remainingSec === 'number' ? incoming.remainingSec : timerState.totalSec;
              localEndTime = Date.now() + timerState.remainingSec * 1000;
            }
          }
        } else {
          localEndTime = null;
          if (typeof incoming.remainingSec === 'number') {
            timerState.remainingSec = incoming.remainingSec;
          }
        }

        triggerVexTimerAudioOnChange(prevRunning, prevSec, timerState.running, timerState.remainingSec, timerState.mode);
        return (prevSec !== timerState.remainingSec || prevMode !== timerState.mode || prevRunning !== timerState.running);
      }

      // Bộ đếm ngược nội bộ 200ms ngay bên trong OBS Browser Source giúp đồng hồ nhảy mượt từng giây 01:30 -> 00:00 mà KHÔNG BAO GIỜ cần Reload OBS
      setInterval(() => {
        if (!timerState.running) return;
        const prevSec = timerState.remainingSec;
        let left = timerState.remainingSec;
        if (timerState.endTime) {
          const nowEst = Date.now() + serverTimeOffset;
          left = Math.max(0, Math.ceil((timerState.endTime - nowEst) / 1000));
        } else if (localEndTime) {
          left = Math.max(0, Math.ceil((localEndTime - Date.now()) / 1000));
        }
        if (left !== prevSec) {
          timerState.remainingSec = left;
          triggerVexTimerAudioOnChange(true, prevSec, left > 0, left, timerState.mode);
          if (left <= 0) {
            timerState.running = false;
            localEndTime = null;
          }
          renderTopRightTimer(getCurrentMatch());
        }
      }, 200);

      if (bc) {
        bc.onmessage = (ev) => {
          if (!ev.data) return;
          if (ev.data.type === 'STATE_UPDATED' && ev.data.state) {
            state = ev.data.state;
            if (ev.data.timerState) applyIncomingTimerState(ev.data.timerState);
            renderAll();
          } else if (ev.data.type === 'TIMER_TICK' && ev.data.timerState) {
            if (applyIncomingTimerState(ev.data.timerState)) {
              renderTopRightTimer(getCurrentMatch());
            }
          }
        };
      }

      window.addEventListener('storage', (ev) => {
        if (ev.key === STORAGE_KEY && ev.newValue) {
          try {
            state = JSON.parse(ev.newValue);
            renderAll();
          } catch (e) {}
        }
      });

      // Đồng bộ Real-time giữa Máy Điền Điểm (admin.html) và Máy Phát OBS (obs.html) qua Live Server (Hỗ trợ cả link Web, Localhost và Local File trong OBS)
      {
        let lastServerStamp = '';

        function pullLatestFromServer() {
          fetch(API_BASE + '/api/state?_t=' + Date.now(), { cache: 'no-store' })
            .then(r => r.json())
            .then(res => {
              if (!res) return;
              let needFullRender = false;
              if (res.state) {
                const newStamp = res.state.lastUpdated || '';
                if (newStamp !== lastServerStamp) {
                  lastServerStamp = newStamp;
                  state = res.state;
                  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                  needFullRender = true;
                }
              } else {
                fetch(API_BASE + '/api/state', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ state })
                }).catch(() => {});
              }
              if (res.timerState) {
                const timerChanged = applyIncomingTimerState(res.timerState, res.serverNow);
                if (!needFullRender && timerChanged) {
                  renderTopRightTimer(getCurrentMatch());
                }
              }
              if (needFullRender) {
                renderAll();
              }
            })
            .catch(() => {});
        }

        pullLatestFromServer();
        setInterval(pullLatestFromServer, 700);

        function connectSSE() {
          try {
            const es = new EventSource(API_BASE + '/api/stream');
            es.onmessage = (ev) => {
              try {
                const data = JSON.parse(ev.data);
                if ((data.type === 'INIT' || data.type === 'STATE_UPDATED') && data.state) {
                  lastServerStamp = data.state.lastUpdated || '';
                  state = data.state;
                  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                  if (data.timerState) applyIncomingTimerState(data.timerState);
                  renderAll();
                } else if (data.type === 'TIMER_TICK' && data.timerState) {
                  if (applyIncomingTimerState(data.timerState)) {
                    renderTopRightTimer(getCurrentMatch());
                  }
                }
              } catch (e) {}
            };
            es.onerror = () => {
              try { es.close(); } catch (e) {}
              setTimeout(connectSSE, 2500);
            };
          } catch (e) {}
        }
        connectSSE();
      }

      window.OBSStream = {
        unmuteVideo() {
          const fvPlayer = document.getElementById('fullscreen-video-player');
          const unmuteBtn = document.getElementById('btn-unmute-video');
          if (fvPlayer) {
            fvPlayer.muted = false;
            fvPlayer.volume = 1.0;
            fvPlayer.play().catch(() => {});
          }
          if (unmuteBtn) unmuteBtn.style.display = 'none';
        },
        setView(v) {
          state.config.obsMainView = v;
          state.lastUpdated = new Date().toISOString();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          fetch(API_BASE + '/api/state', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ state })
          }).catch(() => {});
          renderAll();
        },
        toggleBg() {
          state.config.obsBgMode = state.config.obsBgMode === 'transparent' ? 'image' : 'transparent';
          state.lastUpdated = new Date().toISOString();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          fetch(API_BASE + '/api/state', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ state })
          }).catch(() => {});
          renderAll();
        },
        toggleFullscreen() {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        }
      };

      document.addEventListener('DOMContentLoaded', renderAll);
    })();
  </script>
</body>
</html>
